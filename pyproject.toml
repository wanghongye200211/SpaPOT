[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spapot"
version = "0.1.0"
description = "Spatial Potential Optimal Transport for spatial transcriptomic trajectory reconstruction."
requires-python = ">=3.9"
dependencies = [
  "anndata",
  "h5py",
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "pot",
  "scipy",
  "torch",
  "torchdiffeq",
]

[tool.setuptools.packages.find]
where = ["src"]
